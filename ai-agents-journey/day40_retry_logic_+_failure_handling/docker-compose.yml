version: '3.8'

services:

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  api:
    build: .
    command: uvicorn api_server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ../../.env

  worker:
    build: .
    command: python worker/worker.py
    depends_on:
      - redis
    env_file:
      - .env
